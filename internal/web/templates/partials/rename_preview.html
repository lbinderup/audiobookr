{{define "rename_preview"}}
{{if .Err}}
<div class="row-line warn-text">⚠ {{.Err}}</div>
{{else if .Same}}
<div class="row-line muted">📁 Already where the template puts it — the file stays put.</div>
{{else if .New}}
<div class="row-line rename-line">📁 <span class="muted">{{.Old}}</span> → <strong>{{.New}}</strong></div>
{{end}}
{{end}}
