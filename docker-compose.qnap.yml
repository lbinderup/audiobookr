# QNAP Container Station — paste this into Applications → Create.
#
# Adjust the host paths, ids and timezone before deploying.
# Find your ids over SSH with:    id <account>
# Check who owns your media with: ls -ln /share/Media/Audiobooks
#
# See docs/qnap.md for the full walkthrough, including how to let both a
# personal account and the container service account manage the same files.
services:
  audiobookr:
    image: ghcr.io/lbinderup/audiobookr:latest
    container_name: audiobookr
    environment:
      # Run as the account that already owns your *arr-managed files — on most
      # NAS setups a dedicated service account, not a personal login.
      - PUID=1000
      # Primary group. Use a group that both that service account and your
      # personal account belong to, so both can manage the finished files.
      - PGID=100
      # 002 => new files 664 / dirs 775, i.e. group-writable. This is what lets
      # a second account delete or rename what the container produced.
      - UMASK=002
      # Optional: extra group memberships, comma separated.
      # - SUPPLEMENTARY_GIDS=100,1000
      - TZ=Etc/UTC
    volumes:
      # App data (database + job logs). Must be local disk, never a network mount.
      - /share/Container/audiobookr/config:/config
      # Where new audiobooks land (e.g. your download client's audiobook folder).
      - /share/Media/Downloads/Audiobooks:/input
      # Your Plex/Prologue library — finished .m4b files are written here.
      - /share/Media/Audiobooks:/output
      # Optional: only needed if you use the "move" cleanup mode.
      - /share/Media/Downloads/Processed:/completed
    ports:
      - "8684:8684"
    restart: unless-stopped
